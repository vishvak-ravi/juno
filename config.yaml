# Settings for the API server (`python -m server`) and the recorder (`python -m capture`).
# Read from the working directory, or from the path in JUNO_CONFIG_PATH.

# This device's settings (server host, device id) are in .env; see .env.example.

server:
  port: 8765

llm:
  # The OpenAI-compatible server that chats are completed by. The model is
  # whichever one that server lists.
  base_url: http://localhost:8000
  max_tokens: 2048
  temperature: 0.7
  # Seconds to wait for a reply.
  timeout_seconds: 300

tools:
  # Tools the chat model has besides reading annotations. Anyone who can reach
  # this server can have them used, through /chats or /mcp.
  bash:
    enabled: true
    # Run commands under bubblewrap: system directories read-only, no home
    # directory, only <data_dir>/workspace writable; the network stays open.
    # false: commands run as this user, with all of its files.
    sandbox: true
    # Seconds a command may run before it is killed.
    timeout_seconds: 60
  web_search:
    enabled: true
    # Most results one search returns.
    max_results: 8
  claude:
    # fwd_to_claude: prompts forwarded to Claude Code in a tmux window of the
    # running tmux server (a session named juno is started if there is none).
    # Claude runs as this user, outside the bash sandbox.
    enabled: true
    # Model of a new conversation when the call names none. null: Claude Code's default.
    model: null
    # --permission-mode for new conversations. null: Claude Code's own setting.
    permission_mode: null
    # Seconds to wait for Claude to finish one turn.
    timeout_seconds: 600

capture:
  # Base directory; the recorder's sessions go under screen/sessions/, the
  # server's copies of every device's under screen/devices/, chats under chats/.
  # null: $XDG_DATA_HOME/juno, or ~/.local/share/juno.
  data_dir: null
  # Platform sources: auto (detect from the platform and session), wayland, x11,
  # macos, fake.
  backend: auto
  fps: 5
  # Seconds of frames to keep in memory.
  buffer_seconds: 120
  # Target DPI for saved screenshots.
  dpi: 100
  # Scale factor for screenshots (0.0-1.0); overrides dpi.
  scale: null
  # Maximal screenshot resolution as [width, height].
  max_res: null
  # Event types to skip: move, scroll, click, key.
  disable: [move]
  # Whether screenshot files are written.
  screenshots: true
  # Stop after this many seconds. null: run until Ctrl+C.
  duration: null
  verbose: false

annotate:
  # The model that annotates recorded sessions, as a litellm model string
  # <provider>/<name>: gemini/<model> (key GEMINI_API_KEY in .env),
  # openrouter/<vendor>/<model> (OPENROUTER_API_KEY), or openai/<served name>
  # for a model on an OpenAI-compatible server (llama.cpp, vLLM, SGLang) at
  # api_base. Each annotation records it.
  model: openai/Qwen3.8-27B-UD-Q4_K_M
  # The server an openai/ model is sent to, e.g. http://localhost:8000/v1; it
  # needs no key. null: the provider's own endpoint.
  api_base: http://localhost:57617/v1
  # Upper bound on the reply, hidden reasoning included.
  max_tokens: 8192
  # Aggregations (screenshots) per request.
  chunk_size: 10
  # Whether the recorder uploads each aggregation to the server, which annotates
  # each chunk as it fills. Every screenshot then goes to the model's provider.
  live: true
  # Model calls the server keeps in flight at once.
  max_concurrency: 4
  # Calls made for one chunk before its annotation is left failed. A call is
  # repeated only when the provider was busy or the reply was not an annotation.
  max_attempts: 3
  # Seconds one call may take.
  timeout_seconds: 300
  # Seconds every call waits after the provider was busy: the base doubles with
  # each attempt of the chunk, up to the maximum.
  retry_base_seconds: 5
  retry_max_seconds: 120
  # Whether the server, on its own, annotates every chunk in its store that has
  # no finished annotation, most recent first, behind the chunks recorders are
  # filling now. Every stored screenshot then goes to the model's provider.
  backfill: true
  # Seconds between the server's looks through its store for such chunks.
  scan_interval_seconds: 60
  # Seconds a session must have gone without a new row before the rows after its
  # last full chunk are annotated.
  tail_idle_seconds: 300

keypoints:
  # Jev, TypeSafe's System One model, asked the questions in
  # packages/server/src/keypoints/questions.json about every row of a chunk once
  # the chunk is annotated (key TYPESAFE_API_KEY in .env). Every screenshot then
  # goes to TypeSafe. Runs under the annotate switch.
  enabled: true
  model: jev-1.14.0
  # Rows asked about at once.
  max_concurrency: 8
  # A moment starts at a probability of at least moment_on; a moment of the
  # same type that stays on screen starts again only after the probability has
  # dropped below moment_off.
  moment_on: 0.7
  moment_off: 0.4
  # Seconds per bucket of GET /indices when the request names none.
  bucket_seconds: 300

predict:
  # Next-action prediction (`POST /predictions`); the defaults are Tada's.
  # Annotated actions the model is shown; a prediction needs at least this many.
  past_len: 50
  # Actions the model is asked to predict.
  future_len: 8
  # Screenshots sent, those of the newest actions. null: text only. The model
  # server must accept images (vLLM without --language-model-only).
  num_imgs_per_sample: 5
  max_tokens: 2048
  temperature: 1.0
  # Earlier activity retrieved with BM25, and how many of those are kept after
  # MMR removes near-duplicates (alpha 1.0: relevance only).
  top_k: 20
  mmr_k: 10
  mmr_alpha: 0.5
  # How fast older activity loses retrieval score, per day of age.
  time_decay_lambda: 0.5

grade:
  # The judge that scores a candidate sequence of action captions against a
  # reference one: annotations against annotations
  # (`scripts/grade_action_captions.py`) and predictions against the actions
  # that followed (`scripts/benchmark_prediction.py`). Tada's default reward_llm.
  model: gemini/gemini-3.1-flash-lite
  # The OpenAI-compatible server a local judge is served from. null: the
  # provider's own endpoint.
  api_base: null
  # Calls made for one judgement while the provider is busy.
  max_attempts: 5
  # Seconds to wait between them when the provider names no time.
  retry_seconds: 60

control:
  # Seconds between a recorder's reports to the server, each of which also tells
  # it whether to record; the status page refreshes as often.
  poll_seconds: 5
  # Seconds without a report after which a device shows as offline.
  offline_seconds: 30
  # Seconds between a client's checks of what changed in the timeline (GET /changes).
  live_seconds: 2

draw:
  # The device id the server records the /draw page's sessions under; its
  # recording switch is on the Status page like any recorder's.
  device_id: tablet

claude_hook:
  # The Claude Code hook that reports each prompt typed in this device's
  # terminal to the server (`python -m capture.claude_hook install`). Seconds
  # Claude Code waits for the server before sending the prompt on anyway; read
  # when the hook is installed.
  timeout_seconds: 3

client:
  # The desktop client (apps/desktop), which reads this file through the
  # checkout's Python when it starts. Actions either side of the open one whose
  # screenshots are fetched ahead, so stepping to them shows each at once.
  prefetch: 3

lattice:
  # Behavior Latticing (Zhao et al., arXiv 2604.07629) over the events in
  # `events`: an activity event's interaction is its action caption with its
  # chunk's dense caption, a message event's is one turn of a conversation; an
  # observer reads windows of them and writes observations; each layer groups
  # the nodes below it and a model synthesizes each group into insights
  # (`scripts/build_lattice.py`, `POST /lattice`). The name the prompts call
  # the user.
  user_name: Vishvak
  # What the prompts say the interactions are; {user_name} is filled in.
  description: "{user_name}'s screen activities and conversations with coding assistants"
  # The event types read: activity (the action captions of recorded sessions),
  # message (the turns of the conversations scripts/import_conversations.py
  # stored). Leave one out to build over the other alone.
  events: [activity, message]
  # Characters of a conversation turn the observer is shown, at most; a pasted
  # log is cut there so one turn cannot fill a window.
  turn_chars: 2000
  # litellm model strings, as annotate.model: the observer writes observations
  # from windows of interactions, the insight model synthesizes each group into
  # insights, the evidence model maps a layer 1 insight to the observations
  # that support it, the format model turns insight prose into JSON.
  observer_model: openai/cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  insight_model: openai/cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  evidence_model: openai/cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  format_model: openai/cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  # The server an openai/ model is sent to. null: the provider's own endpoint.
  api_base: http://localhost:8000/v1
  # Upper bound on a reply, hidden reasoning included. A server that holds a
  # context of fixed length (vLLM) takes a prompt of at most its context length
  # less this.
  max_tokens: 2048
  # Model calls in flight at once.
  max_concurrency: 8
  # Seconds one call may take.
  timeout_seconds: 300
  # Calls made for one prompt while the provider is busy, and the seconds waited
  # after it was: the base doubles with each attempt, up to the maximum.
  max_attempts: 3
  retry_base_seconds: 2
  retry_max_seconds: 30
  # Interactions per observer window.
  window_size: 25
  # Insights the model is asked for per group, at least.
  min_insights: 3
  # Hours without an activity interaction that start a new session; each
  # conversation is one session of its own.
  session_gap_hours: 3
  # Layer 1 first; the last entry is the top of the lattice. type session: nodes
  # of `value` consecutive sessions per group; time: one group per `value`
  # (day, week, month, year); number: `value` nodes per group; all: one group
  # of every node, the layer that ends in one insight.
  layers:
    - {type: number, value: "40"}
    - {type: time, value: day}
    - {type: all}

dawn:
  # Dawn (Zhao et al., arXiv 2604.07629, Sec. 4): tasks the user could use a
  # personal agent for, induced from one day's action captions, scored for how
  # much the lattice's insights would change the help, and two actions proposed
  # per kept task (scripts/propose_actions.py). litellm model strings sent as
  # lattice.api_base sends them: the task model synthesizes the day's
  # high-level tasks, the utility model scores each task 0-1, the action model
  # proposes the actions.
  task_model: openai/cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  utility_model: openai/cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  action_model: openai/cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  # The cross encoder that ranks the lattice's insights against a task:
  # voyage/<model> (key VOYAGE_API_KEY in .env), or llm to have the utility
  # model score each insight's relevance instead.
  rerank_model: voyage/rerank-2.5
  # Action captions the task model reads at once; the tasks of every window
  # are then put to it again as the list of goals to choose from. 0: the whole
  # day in one call. A day holds 1,000-2,000 captions, 25k-110k tokens.
  actions_per_window: 150
  # Tasks scoring below this are dropped.
  utility_threshold: 0.75
  # Insights given to the action model per task, the best ranked.
  insights_per_task: 2
  # What the action model is told the agent that will carry out its actions can
  # and cannot do (the paper's implementation constraints, Appendix A.7).
  constraints: |
    The proposed solutions must be actions or plans for a tool-calling agent running in the Hermes harness, a general-purpose agent harness. Its capabilities are a superset of a personal assistant's:
    - Query an LLM endpoint
    - Access to local file systems (READ / WRITE documents)
    - Access MCP servers for Google Drive (READ / WRITE documents)
    - Access MCP servers for creating slide decks
    - Access MCP servers for Apple Calendar (READ / WRITE events)
    - Conduct a web search
    - Draft text (e.g., message, email, Slack message, text message)
    - Run shell commands and code, browse the web, and call any other MCP server or tool the harness is given

    ### The tool-calling agent **CANNOT**:
    - Execute physical-world actions

    Actions do NOT need to use all of the capabilities. Always defer to the most minimal implementation that can achieve the desired solution.

proposals:
  # Dawn's proposals as the clients show them (`/proposals`). The local time
  # (HH:MM) the server proposes for the day before, over the newest finished
  # lattice; null: only when asked (the Today button, `POST /proposals/runs`).
  propose_at: "05:00"
  # Seconds a proposal must have been open for a no (dismissed or snoozed) to
  # count as almost accepted; an edited action counts whatever the time.
  almost_seconds: 30
  # A task scoring under dawn.utility_threshold by at most this is almost asked:
  # shown under the line with a way to propose for it anyway.
  near_threshold: 0.1
