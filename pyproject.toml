# The uv workspace: one lockfile and one .venv for the three packages under
# packages/. `uv sync` installs all of them; a device that runs only one role
# installs that package alone with `uv sync --package juno-capture` (the
# recorder, which the desktop client starts) or `uv sync --package juno-server`.
[project]
name = "juno"
version = "0.1.0"
description = "Juno: the API server, the recorder and what they share."
requires-python = ">=3.12,<3.14"
dependencies = ["juno-core", "juno-capture", "juno-server"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# napsack's unpinned dependency tree lets the resolver fall back to releases
# with no wheels for this Python. Hold these at what Tada's lockfile resolves to.
constraint-dependencies = ["tokenizers>=0.20"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
juno-core = { workspace = true }
juno-capture = { workspace = true }
juno-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/capture/tests", "packages/server/tests"]
