<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; img-src 'self' http: https:" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Juno Browser</title>
<style>
  :root { --bg: #ffffff; --ink: #1a1a1a; --dim: #6b6b6b; --line: #dcdcdc; --raw: #f4f4f4; --accent: #2457c5; --accent-bg: #eef3fd; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161616; --ink: #e8e8e8; --dim: #9a9a9a; --line: #333; --raw: #1f1f1f; --accent: #8fb0ff; --accent-bg: #1c2438; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #161616; --ink: #e8e8e8; --dim: #9a9a9a; --line: #333; --raw: #1f1f1f; --accent: #8fb0ff; --accent-bg: #1c2438; color-scheme: dark; }

  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(16rem, 22rem) 1fr; height: 100%; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; } }
  nav, #detail { overflow: auto; padding: 1rem; }
  nav { border-right: 1px solid var(--line); }
  @media (max-width: 700px) { nav { border-right: 0; border-bottom: 1px solid var(--line); } }

  h2, h3 { font-size: 14px; margin: 0 0 .5rem; }
  h3 { color: var(--dim); font-weight: 500; margin-top: .75rem; }
  h2 + h2, section + h2 { margin-top: 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { display: block; width: 100%; text-align: left; padding: .4rem 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; }
  li button[aria-current="true"] { font-weight: 600; }
  small, .status { color: var(--dim); }
  /* The pinned rows (Timeline, Predictions), set apart from the chats below them. */
  #pinned { margin-bottom: 1.5rem; }
  #pinned li + li { margin-top: .25rem; }
  #pinned button { padding: .4rem .6rem; border: 0; border-left: 3px solid var(--accent); background: var(--accent-bg); color: var(--accent); }
  /* One switch on the status page: the checkbox and label, what it reports below. */
  li.switch { padding: .4rem 0; border-bottom: 1px solid var(--line); }
  li.switch small { display: block; }
  button.more { padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 4px; background: none; color: inherit; font: inherit; cursor: pointer; }
  section > button.more { margin-top: .5rem; }
  h2 button.more { margin-left: .5rem; font-weight: normal; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  article { margin: 0 0 1rem; max-width: 70ch; }
  article b { display: block; color: var(--dim); font-weight: 500; }
  article p { margin: 0; white-space: pre-wrap; }
  /* Assistant replies, read as markdown. */
  .md p { white-space: normal; margin: 0 0 .5rem; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 15px; margin: .75rem 0 .25rem; }
  .md ul, .md ol { list-style: revert; margin: 0 0 .5rem; padding-left: 1.5rem; }
  .md code { font: 12px/1.4 ui-monospace, monospace; background: var(--raw); padding: 0 .2em; }
  .md pre { margin: 0 0 .5rem; }
  .md pre code { padding: 0; }
  form { display: flex; gap: .5rem; max-width: 70ch; }
  form input { flex: 1; padding: .4rem; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }

  pre, li.event { font: 12px/1.4 ui-monospace, monospace; font-variant-numeric: tabular-nums; overflow-x: auto; }
  pre { margin: .25rem 0 0; padding: .5rem; background: var(--raw); }
  li.event { padding: .15rem 0; white-space: pre; }
  details { border-bottom: 1px solid var(--line); padding: .3rem 0; }
  summary { cursor: pointer; }
  /* Each open level sits inside its parent's region. */
  .nest { margin: .25rem 0 0 .5rem; padding-left: .75rem; border-left: 2px solid var(--line); }
  img { display: block; max-width: 100%; margin-top: .5rem; }
  /* A prediction beside what actually happened next. */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  @media (max-width: 700px) { .compare { grid-template-columns: 1fr; } }
  .compare pre, pre.wrap { white-space: pre-wrap; }
  /* What the predictor was sent: its screenshots as thumbnails; a click shows one full width. */
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: .5rem; }
  .shots img { margin: 0; cursor: zoom-in; border: 1px solid var(--line); }
  .shots img.big { grid-column: 1 / -1; cursor: zoom-out; }

  /* The camera with the hand keypoints (hand.js), mirrored like a mirror. */
  #hand { position: fixed; right: 1rem; top: 1rem; width: 240px; background: var(--bg); }
  #camera, #overlay { display: block; width: 100%; transform: scaleX(-1); }
  #overlay { position: absolute; top: 0; left: 0; }
</style>
</head>
<body>

<div id="hand">
  <video id="camera" muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="hand-label"></div>
</div>

<main>
  <nav>
    <ul id="pinned">
      <li><button id="timeline">Timeline<br><small>Every device's events, newest first</small></button></li>
      <li><button id="predictions">Predictions<br><small>Graded benchmark predictions, newest first</small></button></li>
      <li><button id="status">Status<br><small>Recording and annotation, with their switches</small></button></li>
    </ul>
    <h2>Chats <button id="new-chat" class="more">New</button></h2>
    <section id="chats"></section>
  </nav>
  <div id="detail"><p class="status">Pick the timeline, predictions, status or a chat.</p></div>
</main>

<script type="module">
  // The desktop browser: the timeline, predictions, status and chats, two panes,
  // drawn with the modules in apps/web/src that the phone page shares. Data comes
  // from the Electron bridge (window.juno) or, opened in a browser, from the server
  // on this computer, else from the examples below.
  import { api, send, useExamples } from "../../../web/src/api.js";
  import { markdown } from "../../../web/src/markdown.js";
  import { controlView, el, load, messageOf, paged, predictionDetail, score, time, timelineEvent } from "../../../web/src/views.js";

  // Stand-in responses, in the server's shapes, for viewing this page without a server.
  const EXAMPLE = {
    "/chats?limit=20": { object: "list", data: [
      { id: "chat-a", title: "What did I work on this morning", message_count: 4, updated_at: 1791100000 },
      { id: "chat-b", title: null, message_count: 0, updated_at: 1791090000 }],
      first_id: "chat-a", last_id: "chat-b", has_more: false },
    "/chats/chat-a": { id: "chat-a", messages: [
      { role: "user", content: "What did I work on this morning?" },
      { role: "assistant", content: "Mostly the **recorder**: two sessions, about 40 minutes each.\n\n## Sessions\n\n1. `session_20261003_091500`, 12 aggregations\n2. `session_20261002_161000`, still empty\n\nTo check the newest one:\n\n```bash\nls ~/.local/share/juno/screen/sessions | tail -1\n```" },
      { role: "user", content: "Anything else?" },
      { role: "assistant", content: "A short detour into the config loader." }] },
    "/chats/chat-b": { id: "chat-b", messages: [] },
    "/events?limit=20": { object: "list", data: [
      { id: "laptop-session_20261003_091500-000001", device_id: "laptop", timestamp: 1791100200.5,
        screenshot_url: "/events/laptop-session_20261003_091500-000001/screenshot",
        inputs: [{ type: "mouse_down", timestamp: 1791100200.4, button: "Button.left", x: 640, y: 400 }],
        caption: "Clicks into the terminal." },
      { id: "laptop-session_20261003_091500-000000", device_id: "laptop", timestamp: 1791100100.2, screenshot_url: null,
        inputs: [{ type: "key_press", timestamp: 1791100100.0, key: "a" }, { type: "key_release", timestamp: 1791100100.1, key: "a" }],
        caption: null }],
      first_id: "laptop-session_20261003_091500-000001", last_id: "laptop-session_20261003_091500-000000", has_more: false },
    "/predictions?limit=20": { object: "list", data: [
      { id: "laptop-session_20261003_091500-20261004_100000-0000", device_id: "laptop", session_id: "laptop-session_20261003_091500",
        run: "20261004_100000", index: 0, graded_at: 1791200000, dataset: "datasets/20261004_095500.jsonl",
        predictor: { model: "hosted_vllm/local-model", api_base: "http://localhost:8000/v1", max_tokens: 2048, temperature: 1.0 },
        grader: { model: "gemini/gemini-3.1-flash-lite", api_base: null }, cutoff_ts: 1791100200.5, future_len: 2,
        ground_truth: "<actions>\n    <action>Clicks into the terminal.</action>\n    <action>Runs the tests.</action>\n</actions>",
        prediction: "<actions>\n    <action>Clicks into the terminal.</action>\n    <action>Opens the README.</action>\n</actions>",
        error: null, reward: 0.66, accuracy: 0.55, formatting: 0.78, validation_errors: [], unparsed_replies: [] }],
      first_id: "laptop-session_20261003_091500-20261004_100000-0000", last_id: "laptop-session_20261003_091500-20261004_100000-0000", has_more: false },
  };
  EXAMPLE["/control"] = {
    server: { annotate: true, queue: { queued: { live: 1, requested: 0, backfill: 12 }, running: 2, paused_seconds: 0 } },
    devices: { laptop: { capture: true, reported: { capture: "running", session_id: "laptop-session_20261003_091500" },
                         reported_at: 1791100200, online: true } },
    poll_seconds: 5 };
  EXAMPLE["/predictions/laptop-session_20261003_091500-20261004_100000-0000"] = {
    ...EXAMPLE["/predictions?limit=20"].data[0],
    messages: [{ role: "user", content: [{ type: "text", text: "You will analyze user behavior and predict what the user will do next. Below are the actions the user took.\n\n<actions>\n    <action>Types a letter in the editor.</action>\n</actions>\n\nPredict the next 2 actions the user will take." }] }],
    retrieved: "",
    accuracy_prompt: "You are an expert evaluator. …", accuracy_reply: "{\"candidates\": [{\"id\": 1, \"score\": 0.55}]}",
    formatting_prompt: "You are an expert evaluator. …", formatting_reply: "{\"score\": 0.78}" };
  useExamples(EXAMPLE);

  // A collapsed level that fetches its contents the first time it is opened.
  function level(summary, work) {
    const body = el("div", { className: "nest" });
    const d = el("details", {}, el("summary", {}, summary));
    d.ontoggle = () => { if (d.open && !body.parentNode) { d.append(body); load(body, work); } };
    return d;
  }

  const detail = document.getElementById("detail");
  let current = null;
  function select(button) {
    current && current.removeAttribute("aria-current");
    (current = button) && button.setAttribute("aria-current", "true");
  }
  function show(button, path, render) {
    select(button);
    load(detail, async () => render(await api(path)));
  }
  const row = (label, meta, onclick) => el("li", {}, el("button", { onclick }, label, el("br"), el("small", { textContent: meta })));

  // A chat: its messages, then a box to send the next one.
  const message = (m) => el("article", {}, el("b", { textContent: m.role }),
    m.role === "assistant" ? markdown(m.content) : el("p", { textContent: m.content }));
  function chatView(chatId, messages) {
    const input = el("input", { id: "composer", placeholder: "Message", autocomplete: "off" });
    const button = el("button", { className: "more", textContent: "Send" });
    const form = el("form", {}, input, button);
    form.onsubmit = async (event) => {
      event.preventDefault();
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      input.disabled = button.disabled = true;
      const sent = message({ role: "user", content });
      const waiting = el("p", { className: "status", textContent: "…" });
      form.before(sent, waiting);
      try {
        const chat = await send(chatId, content);
        detail.replaceChildren(...chatView(chatId, chat.messages));
        listChats();  // a new chat appears; an existing one moves to the top
      } catch (error) {
        // The server keeps nothing on failure, so the message goes back in the box.
        sent.remove();
        waiting.textContent = messageOf(error);
        input.value = content;
        input.disabled = button.disabled = false;
        input.focus();
      }
    };
    requestAnimationFrame(() => { detail.scrollTop = detail.scrollHeight; input.focus(); });
    return [...messages.map(message), form];
  }

  const chats = document.getElementById("chats");
  const listChats = () => load(chats, async () => [await paged("/chats", (chat) =>
    row(chat.title || chat.id, `${chat.message_count} messages · ${time(chat.updated_at)}`, (event) =>
      show(event.currentTarget, `/chats/${chat.id}`, (full) => chatView(full.id, full.messages))))]);
  listChats();
  // A new chat exists only on the client until its first message is sent.
  document.getElementById("new-chat").onclick = () => {
    select(null);
    detail.replaceChildren(...chatView(crypto.randomUUID(), []));
  };

  document.getElementById("timeline").onclick = (event) => {
    select(event.currentTarget);
    load(detail, async () => [el("h2", { textContent: "Timeline" }), await paged("/events", timelineEvent)]);
  };

  // Predictions: a row per graded prediction, newest first; a row opens in place.
  const graded = (g) => el("li", {}, level(
    `${time(g.graded_at)} · ${g.error ? "failed" : `reward ${score(g.reward)} (accuracy ${score(g.accuracy)}, formatting ${score(g.formatting)})`} · ${g.predictor.model} → ${g.grader.model}`,
    async () => predictionDetail(await api(`/predictions/${g.id}`))));
  document.getElementById("predictions").onclick = (event) => {
    select(event.currentTarget);
    load(detail, async () => [el("h2", { textContent: "Predictions" }), await paged("/predictions", graded)]);
  };

  // Status: the shared switches, with this computer's recorder above the devices.
  // The recorder is a process of the desktop app; null outside it.
  const statusButton = document.getElementById("status");
  const recorderStatus = () => window.juno && window.juno.captureStatus ? window.juno.captureStatus() : null;
  const recorderView = (recorder) => recorder === null ? []
    : recorder.running ? [el("small", { textContent: "This computer's recorder is running." })]
    : [el("small", { textContent: `This computer's recorder exited (${recorder.exitCode}). Fix the cause and restart the app.` }),
       el("pre", { textContent: recorder.log.join("\n") })];
  const statusView = (control, recorder) => controlView(control, redraw, recorderView(recorder));
  async function redraw(control) {
    const recorder = await recorderStatus();
    if (current === statusButton) detail.replaceChildren(...statusView(control, recorder));
  }
  statusButton.onclick = () => {
    select(statusButton);
    load(detail, async () => {
      const [control, recorder] = await Promise.all([api("/control"), recorderStatus()]);
      // Secondary to the first fetch: the same data again, drawn over in place without a loading state.
      const refresh = () => setTimeout(async () => {
        if (current !== statusButton) return;
        try {
          const next = await Promise.all([api("/control"), recorderStatus()]);
          if (current === statusButton && !detail.querySelector("input:disabled")) detail.replaceChildren(...statusView(...next));
        } catch {}
        refresh();
      }, control.poll_seconds * 1000);
      refresh();
      return statusView(control, recorder);
    });
  };
</script>
<script type="module" src="hand.js"></script>
</body>
</html>
