<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; img-src 'self' http: https:" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Juno Browser</title>
<style>
  :root {
    --side: #000000; --bg: #0c0c0d; --ink: #ececea; --dim: #9a9c99; --faint: #66686a; --line: #242426; --field: #333335;
    --hover: #1c1c1e; --current: #232325; --raw: #161617; --track: #242426; --bar: #ececea; --bar-dim: #9a9c99;
    --deck: #0c0c0d; --deck-ink: #ececea; --deck-dim: #9a9c99; --deck-line: #242426; --deck-field: #161617; --deck-field-line: #333335;
    --green: #5fd68a; --amber: #e8b04b; --idle: #6a7075; --accent: #ff7a1a; --accent-ink: #000000; --now: #ff4d3d;
    --moment-agent_prompt_submitted: #00e0ff; --moment-code_landed: #ffe600; --moment-message_sent: #ff3df2;
    --moment-web_search_submitted: #9a9c99; --moment-agent_needs_input: #9eeeff; --moment-error_shown: #c8c8c8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Scrollbars: a thin thumb on no track, darker under the pointer. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--field); background-clip: padding-box; border: 3px solid transparent; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: padding-box; }
  /* What is on its way: three shimmering lines in its place. */
  .pending { display: grid; gap: 10px; padding: 16px 12px; max-width: 420px; }
  .pending i { display: block; height: 12px; border-radius: 6px;
               background: linear-gradient(100deg, var(--raw) 35%, var(--field) 50%, var(--raw) 65%) 150% 0 / 200% 100% no-repeat;
               animation: shimmer 1.4s linear infinite; }
  .pending i:last-child { width: 60%; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--side); color: var(--ink); font: 14px/1.45 "Instrument Sans", system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #deck button:focus-visible, #deck input:focus-visible { outline-color: var(--deck-ink); }
  h1, h2, h3, p { margin: 0; }
  ul, ol { list-style: none; margin: 0; padding: 0; }
  small, .status, .dim { color: var(--dim); }
  .status { font-size: 13px; padding: 8px 12px; }
  .num { font-variant-numeric: tabular-nums; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }

  /* The two panes, with the divider between them dragged to set the left one's width (--aside). */
  #app { display: grid; grid-template-columns: var(--aside, 360px) 5px minmax(0, 1fr); height: 100%; }
  #splitter { cursor: col-resize; border-left: 1px solid var(--line); background: transparent; transition: background .15s; }
  #splitter:hover, #splitter.dragging { background: var(--field); }
  @media (max-width: 700px) { #app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } #splitter { display: none; } }

  /* The left pane: one of chats, timeline or predictions, then the deck pinned below it. */
  aside { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .pane[hidden] { display: none; }
  .pane > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 16px 10px 20px; min-height: 60px; }
  .pane > header h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .pane > header small { font-size: 12px; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .pane .scroll { padding: 4px 12px 12px; }
  button.new { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; border: 1px solid var(--field);
               border-radius: 8px; background: var(--bg); font-size: 13px; font-weight: 500; }
  button.more { display: inline-flex; align-items: center; gap: 6px; height: 32px; margin: 8px 12px; padding: 0 12px; border: 1px solid var(--field);
                border-radius: 8px; background: var(--bg); font-size: 13px; }
  /* The timeline's view switch: two buttons in one outline, the shown one filled. */
  .views { display: inline-flex; padding: 2px; border: 1px solid var(--field); border-radius: 8px; background: var(--bg); }
  .views button { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--dim); font-size: 13px; font-weight: 500; }
  .views button:hover { color: var(--ink); }
  .views button[aria-pressed="true"] { background: var(--current); color: var(--ink); }

  .row { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; background: none; padding: 10px 12px; }
  .row:hover, .group > summary:hover { background: var(--hover); }
  .row[aria-current="true"] { background: var(--current); }
  .row b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row[aria-current="true"] b { font-weight: 600; }
  .row small { display: block; font-size: 12px; margin-top: 2px; }

  /* A session or run: its summary, then its rows on a thread to the left. */
  .group { margin-bottom: 4px; }
  .group > summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 10px 12px; border-radius: 8px; }
  .group > summary > svg { color: var(--faint); transform: rotate(-90deg); transition: transform .15s; }
  .group[open] > summary > svg { transform: none; }
  .group[open] > summary b { font-weight: 600; }
  .label { min-width: 0; grid-column: 2; }
  .label b { display: block; font-weight: 500; }
  .label small { display: block; font-size: 12px; margin-top: 2px; }
  ul.rows { margin: 0 0 6px 15px; padding-left: 12px; border-left: 1px solid var(--line); }
  .row.event { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 10px; padding: 7px 10px; }
  .row.prediction { display: grid; grid-template-columns: 24px minmax(0, 1fr) 76px; gap: 0 10px; align-items: center; padding: 8px 10px; }
  .row .when { font-size: 12px; color: var(--dim); padding-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .caption { display: block; }
  .row.prediction .caption { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row[aria-current="true"] .caption { font-weight: 500; }
  .caption.none, h1.none { color: var(--faint); }
  .reward { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .reward .num { font-size: 12px; width: 26px; text-align: right; }
  button.reveal { display: block; width: 100%; text-align: left; padding: 8px 10px 4px 100px; border: 0; background: none; color: var(--dim); font-size: 12px; }
  ul.rows li:has(.prediction) ~ li button.reveal { padding-left: 44px; }
  .spark-line { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 14px; max-width: 160px; }
  .spark span { flex: 0 1 6px; min-width: 1px; background: var(--bar); }
  .spark span.failed { background: var(--amber); }

  /* The timeline pane: the moment rail down the left edge of the sessions list, a heading where the day changes.
     The open action's session and sequence summaries (aria-current) stick under the day heading as the list
     scrolls, each --pin-* the height of what is pinned above (set by browse.js), so what is scrolled into view
     lands below them. */
  #timeline-pane .body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 30px minmax(0, 1fr); }
  #timeline-pane .scroll { --pin-date: 30px; --pin-session: 0px; --pin-seq: 0px; padding: 0 12px 12px 6px; overflow-x: hidden; }
  .date { position: sticky; top: 0; z-index: 1; background: var(--side); padding: 10px 8px 4px; font-size: 11px; font-weight: 600;
          letter-spacing: .03em; text-transform: uppercase; color: var(--dim); }
  .group.session > summary { border-radius: 0; border-left: 3px solid transparent; padding-left: 9px; scroll-margin-top: var(--pin-date); }
  .group.session[aria-current="true"] > summary { position: sticky; top: var(--pin-date); z-index: 1; background: var(--current); border-left-color: var(--ink); }
  .group.seq { margin: 0; }
  .group.seq > summary { grid-template-columns: 76px minmax(0, 1fr) auto; padding: 6px 10px 6px 10px;
                         scroll-margin-top: calc(var(--pin-date) + var(--pin-session)); }
  .group.seq[aria-current="true"] > summary { position: sticky; top: calc(var(--pin-date) + var(--pin-session)); z-index: 1; background: var(--side); }
  .group.seq > summary .when { font-size: 12px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .group.seq > summary b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal;
                           font-weight: 400; font-size: 13px; }
  .group.seq[open]:not([aria-current="true"]) > summary b { -webkit-line-clamp: unset; }
  /* A sequence's actions keep their sequence's time column; a thread beside their captions marks them as its. */
  .session-body ul.rows { margin: 0 0 6px; padding-left: 0; border-left: 0; }
  .row.event { grid-template-columns: 76px minmax(0, 1fr); padding: 5px 10px 5px 7px; border-radius: 0; border-left: 3px solid transparent;
               scroll-margin-top: calc(var(--pin-date) + var(--pin-session) + var(--pin-seq)); }
  .row.event .when { text-align: right; }
  .row.event .caption { font-size: 13px; padding-left: 10px; border-left: 1px solid var(--line); }
  .row.event[aria-current="true"] { border-left-color: var(--ink); }
  /* A moment: a divider across the rows above the action it starts at, in its type's colour (--c); lit for
     a while after its line on the rail is pressed. */
  li.moment { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0 10px; padding: 7px 10px 1px;
              scroll-margin-top: calc(var(--pin-date) + var(--pin-session) + var(--pin-seq)); }
  li.moment .what { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--c, var(--dim));
                    border-top: 1px solid var(--line); padding-top: 3px; transition: border-color .3s; }
  li.moment .what::before { content: ""; width: 7px; height: 7px; flex: none; transform: rotate(45deg); border-radius: 1px; background: var(--c, var(--dim)); }
  li.moment.lit .what { border-top-color: var(--c, var(--dim)); }

  /* The moment rail: a line per moment, a divider per day; a line's reading shows beside it on hover;
     the line of the moment the list is at is ringed. */
  .moments { position: relative; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); user-select: none; }
  .rail-body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; cursor: pointer; }
  .rail-body .m { position: absolute; left: 0; width: 100%; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center;
                  pointer-events: none; }
  .rail-body .m i { display: block; width: 14px; height: 2px; border-radius: 1px; background: var(--c); transition: width .1s; }
  .rail-body .m.hover i, .rail-body .m:focus-visible i { width: 24px; height: 3px; }
  .rail-body .m.here i { width: 24px; height: 3px; box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 2.5px var(--ink); }
  .rail-body .m:focus-visible { outline: none; }
  .rail-body .d { position: absolute; left: 0; width: 100%; pointer-events: none;
                  background: linear-gradient(transparent calc(50% - .5px), var(--field) calc(50% - .5px), var(--field) calc(50% + .5px), transparent calc(50% + .5px)); }
  .tip { position: absolute; white-space: nowrap; pointer-events: none; padding: 5px 9px 6px; border: 1px solid var(--field); border-radius: 7px;
         background: var(--bg); box-shadow: 0 6px 18px rgba(0, 0, 0, .4); text-align: left; line-height: 1.3; }
  .tip b { display: block; font-size: 12px; font-weight: 600; color: var(--ink); }
  .tip small { display: block; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .moments .tip { left: calc(100% + 8px); transform: translateY(-50%); z-index: 3; }

  /* The calendar's bar: where the calendar is (or the way back to it), its view, the moment types shown, the index drawn. */
  .crumbs { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px;
            flex-wrap: wrap; min-height: 48px; }
  .crumbs .here { font-weight: 600; }
  .crumbs .nav { display: inline-flex; gap: 4px; }
  .crumbs button.step { height: 26px; min-width: 26px; padding: 0 8px; border: 1px solid var(--field); border-radius: 6px; background: var(--bg); color: var(--ink);
                        font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  .crumbs button.step:hover:not(:disabled) { background: var(--hover); }
  .crumbs button.crumb { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px 3px 4px; border: 0; border-radius: 6px; background: none; color: var(--dim); }
  .crumbs button.crumb:hover { background: var(--hover); color: var(--ink); }
  .crumbs .views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .crumbs .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .crumbs select { font: 12px "Instrument Sans", system-ui, sans-serif; height: 26px; border: 1px solid var(--field); border-radius: 6px; background: var(--bg);
                   color: var(--ink); padding: 0 6px; }
  .chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid var(--field); border-radius: 12px; background: none;
          color: var(--ink); font-size: 11px; white-space: nowrap; }
  .chip::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); border-radius: 1px; background: var(--c); }
  .chip[aria-pressed="false"] { color: var(--faint); }
  .chip[aria-pressed="false"]::before { background: none; border: 1px solid var(--faint); }

  /* Days as columns: a session is a block on each day it touches, one index curving down its right side,
     its moments pinned on its left; a line marks now. A month is a grid of days shaded by their events. */
  #detail > .scroll.cal { padding: 0; }
  .columns { display: grid; grid-template-columns: 44px repeat(var(--days), minmax(0, 1fr)); }
  .columns .corner, .columns .head { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 8px 6px;
                                     font-size: 11px; color: var(--dim); }
  .columns .head b { display: block; font-size: 15px; font-weight: 600; color: var(--ink); }
  .columns .head.today b { color: var(--now); }
  .columns .hours { position: relative; height: var(--dayh); font-size: 10px; color: var(--faint); }
  .columns .hours span { position: absolute; right: 6px; transform: translateY(-50%); white-space: nowrap; }
  .col { position: relative; height: var(--dayh); border-left: 1px solid var(--line);
         background: repeating-linear-gradient(180deg, transparent 0 calc(var(--dayh) / 24 - 1px), var(--line) calc(var(--dayh) / 24 - 1px) calc(var(--dayh) / 24)); }
  .col.off { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--raw) 6px 7px); }
  .block { position: absolute; left: 12px; right: 4px; border: 1px solid var(--line); border-radius: 4px; padding: 4px 18px 4px 7px; text-align: left; overflow: hidden;
           background: var(--raw); color: var(--ink); font-size: 11px; line-height: 1.3; }
  .block:hover { border-color: var(--dim); }
  .block b, .block small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block b { font-weight: 600; }
  .block small { color: var(--dim); font-size: 10.5px; }
  /* A block too short for two lines keeps its first; the shortest keep only their outline and curve. */
  .block.short { padding-top: 1px; padding-bottom: 1px; }
  .block.short small, .block.tiny b, .block.tiny small { display: none; }
  .block .curve { position: absolute; right: 3px; top: 3px; bottom: 3px; width: 12px; }
  .block .curve path { fill: var(--ink); fill-opacity: .35; }
  .pin { position: absolute; left: 1px; width: 9px; height: 9px; margin-top: -4px; padding: 0; border: 0; border-radius: 2px; transform: rotate(45deg);
         background: var(--c); z-index: 1; }
  .pin:hover, .pin:focus-visible { box-shadow: 0 0 0 2px var(--ink); outline: none; }
  /* A pin holding several moments wears a ring. */
  .pin.many { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 2.5px var(--c); }
  .pin.many:hover, .pin.many:focus-visible { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 2.5px var(--ink); }
  .col .now { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 1; pointer-events: none; }
  .col .now::before { content: "now"; position: absolute; right: 4px; top: -14px; font-size: 10px; font-weight: 600; color: var(--now); }
  .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 16px; }
  .month .weekday { text-align: center; font-size: 11px; color: var(--faint); padding: 2px 0 6px; }
  .month .cell { aspect-ratio: 1.4; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); text-align: left; padding: 6px 8px;
                 background: color-mix(in srgb, var(--ink) calc(var(--shade, 0) * 35%), var(--raw)); }
  .month .cell:hover:not(:disabled) { border-color: var(--dim); }
  .month .cell.other { color: var(--faint); }
  .month .cell.today b { color: var(--now); }
  .month .cell b { font-weight: 600; }

  /* Score bars and status lights. */
  .track { display: block; flex: 1 1 auto; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .track > span { display: block; height: 100%; background: var(--bar); }
  .track.dim > span { background: var(--bar-dim); }
  .light { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .light.recording { background: var(--green); }
  .light.changing { background: var(--amber); }
  .light.offline { background: none; border: 1.5px solid var(--faint); }

  /* The deck: the view and panel buttons, with the open panel above them. */
  #deck { background: var(--deck); color: var(--deck-ink); border-top: 1px solid var(--deck-line); }
  #deck small, #deck .note { color: var(--deck-dim); font-size: 12px; }
  #panel { padding: 16px 16px 6px; border-bottom: 1px solid var(--deck-line); }
  #panel > header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #panel > header b { font-size: 13px; font-weight: 600; }
  button.close { width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--deck-dim);
                 display: flex; align-items: center; justify-content: center; }
  button.close:hover { color: var(--deck-ink); background: var(--hover); }
  #panel ul li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 10px 0;
                 border-top: 1px solid var(--deck-line); }
  #panel ul li > div { min-width: 0; }
  #panel ul li b { display: block; font-size: 13px; font-weight: 500; }
  #panel ul li small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel pre { font: 11px/1.4 ui-monospace, monospace; max-height: 8rem; overflow: auto; background: var(--deck-field); padding: 6px 8px; margin: 6px 0; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--deck-dim); cursor: pointer; }
  .sw { appearance: none; width: 30px; height: 18px; margin: 0; border-radius: 9px; background: var(--deck-field-line); position: relative; cursor: pointer; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--deck-ink); transition: transform .15s; }
  .sw:checked { background: var(--green); }
  .sw:checked::after { transform: translateX(12px); }
  #panel label.field { display: block; font-size: 12px; color: var(--deck-dim); margin-bottom: 6px; }
  #panel form { display: flex; gap: 8px; }
  #panel form input { flex: 1 1 auto; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--deck-field-line); border-radius: 6px;
                      background: var(--deck-field); color: var(--deck-ink); font-size: 13px; }
  #panel form button { height: 34px; padding: 0 14px; border: 0; border-radius: 6px; background: var(--deck-ink); color: var(--deck); font-size: 13px; font-weight: 500; }
  #panel .note { display: flex; align-items: center; gap: 7px; margin: 10px 0 12px; }
  #bar { display: flex; align-items: center; gap: 2px; padding: 4px 8px; }
  #bar .spacer { flex: 1 1 auto; }
  .tab { width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--faint);
         display: flex; align-items: center; justify-content: center; position: relative; }
  .tab:hover { color: var(--ink); background: var(--hover); }
  .tab[aria-pressed="true"], .tab[aria-expanded="true"] { background: var(--current); color: var(--ink); }
  .tab .light { position: absolute; top: 6px; right: 6px; box-shadow: 0 0 0 2px var(--deck); }
  .tab .light.offline { background: var(--deck); }

  /* The detail pane: a chat, the calendar, an action or a prediction. */
  main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  #detail { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #detail > .status { padding: 40px 48px; }
  #detail > .scroll { padding: 40px 48px 32px; }
  .page { max-width: 960px; }
  .page .meta { font-size: 13px; color: var(--faint); margin-bottom: 6px; }
  .page .resume { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 16px; }
  .page .resume > span { display: inline-flex; align-items: center; gap: 8px; }
  button.primary { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; }

  .md p { white-space: normal; margin: 0 0 10px; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 15px; font-weight: 600; margin: 16px 0 6px; }

  #detail > .scroll:has(.ribbon) { padding: 0; }
  #detail > .scroll:has(.ribbon) .page { padding: 24px 40px 32px; }
  .ribbon { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 8px; padding: 8px 16px 6px;

  .ribbon .blk { top: 4px; bottom: 4px; background: var(--field); border-radius: 2px; }
  .ribbon .pin { top: 50%; width: 9px; height: 9px; margin: -4px 0 0 -4px; z-index: 2; }
  .ribbon .at { top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); }
  .ribbon .now { top: -3px; bottom: -3px; width: 2px; background: var(--now); }

  .page .parent { font-size: 13px; color: var(--dim); max-width: 66ch; margin: 0 0 16px; padding-left: 12px; border-left: 2px solid var(--line); }

  /* The screenshot's box is reserved before it arrives. The image shows only once whole; while it
     is on its way a shimmer crosses the box, starting late enough that a quick load never shows one.
     The replay's overlays sit over it: a click or scroll where it happened (--x, --y in the image's
     --w × --h pixels), keys as a bubble in the corner. */
  .shot-box { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--raw); }
  .shot-box::after { content: ""; position: absolute; inset: 0; opacity: 0;
                     background: linear-gradient(100deg, transparent 35%, var(--field) 50%, transparent 65%) 150% 0 / 200% 100% no-repeat;
                     animation: appear .2s .3s forwards, shimmer 1.4s .3s linear infinite; }

  .shot-box.loaded img.shot { opacity: 1; }
  @keyframes appear { to { opacity: 1; } }
  @keyframes shimmer { to { background-position: -50% 0; } }

  .shot-box .ov b { font-weight: 600; margin-right: 6px; }

  .shot-box .ov small { color: var(--dim); margin-left: 6px; }
  .shot-box .ov.click, .shot-box .ov.scroll { left: calc(var(--x) / var(--w) * 100%); top: calc(var(--y) / var(--h) * 100%); transform: translate(20px, -50%); }
  .shot-box .ov.click::before, .shot-box .ov.scroll::before { content: ""; position: absolute; left: -34px; top: 50%; width: 28px; height: 28px; margin-top: -14px;
                                                             border: 2px solid var(--ink); border-radius: 50%; box-shadow: 0 0 0 4px rgba(0, 0, 0, .5); }
  .shot-box .ov.scroll::before { width: 14px; height: 44px; left: -27px; margin-top: -22px; border-radius: 7px; }
  .shot-box .ov.bubble { left: 12px; top: auto; bottom: 12px; transform: none; }
  .shot-box .ov.bubble::before { content: none; }
  .replay { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--dim); }
  .replay .play { width: 28px; height: 28px; border: 1px solid var(--field); border-radius: 6px; background: none; color: var(--ink);
                  display: flex; align-items: center; justify-content: center; }
  .replay .line { position: relative; display: block; height: 28px; margin: 0 8px; }
  .replay .line::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--field); }
  .replay .stop { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; padding: 0; border: 2px solid var(--dim); border-radius: 50%;

  .frames .frame i { position: absolute; top: 3px; left: 3px; width: 6px; height: 6px; transform: rotate(45deg); background: var(--c); }
  .inputs { display: grid; grid-template-columns: 72px 96px minmax(0, 1fr); gap: 8px 16px; margin-top: 12px; font-size: 13px; align-items: baseline; }

  #hand { position: absolute; top: 16px; right: 16px; z-index: 1; }

        grader: { model: "gemini/gemini-3.1-flash-lite", api_base: null }, cutoff_ts: 1791100200.5, future_len: 2,
        ground_truth: "<actions>\n    <action>Clicks into the terminal.</action>\n    <action>Runs the tests.</action>\n</actions>",
        prediction: "<actions>\n    <action>Clicks into the terminal.</action>\n    <action>Opens the README.</action>\n</actions>",
        error: null, reward: 0.66, accuracy: 0.55, formatting: 0.78, validation_errors: [], unparsed_replies: [] }],
      first_id: "laptop-session_20261003_091500-20261004_100000-0000", last_id: "laptop-session_20261003_091500-20261004_100000-0000", has_more: false },
  };
  EXAMPLE["/indices"] = { names: ["sensitivity", "agent", "error"], bucket_seconds: 300,
    buckets: Array.from({ length: 60 }, (_, n) => new Date().setHours(9, 0, 0, 0) / 1000 + n * 300).filter((start, n) => n < 24 || n > 30).map((start, n) => ({
      start, rows: 30, detected: 30,
      values: { sensitivity: 0.1 + 0.08 * Math.sin(n / 5), agent: 0.5 + 0.4 * Math.sin(n / 7), error: n % 11 === 0 ? 0.7 : 0.05 } })) };
  EXAMPLE["/sessions"] = { object: "list", data: [
    { id: "laptop-session_20261003_091500", device_id: "laptop", start: 1791100100.2, end: 1791100560.4, event_count: 4, captioned: 3,
      moments: [{ type: "agent_prompt_submitted", label: "claude_code", timestamp: 1791100200.5, event_id: "laptop-session_20261003_091500-000001" },
                { type: "code_landed", label: null, timestamp: 1791100560.4, event_id: "laptop-session_20261003_091500-000003" }] }],
    first_id: "laptop-session_20261003_091500", last_id: "laptop-session_20261003_091500", has_more: false };
  EXAMPLE["/sessions/laptop-session_20261003_091500"] = { ...EXAMPLE["/sessions"].data[0], events: EXAMPLE["/events"].data.slice(0, 4) };
  EXAMPLE["/control"] = {
    server: { annotate: true, queue: { queued: { live: 1, requested: 0, backfill: 12 }, running: 2, paused_seconds: 0 } },
    devices: { laptop: { capture: true, reported: { capture: "running", session_id: "laptop-session_20261003_091500" },
                         reported_at: 1791100200, online: true } },
    poll_seconds: 5 };
  EXAMPLE["/predictions/laptop-session_20261003_091500-20261004_100000-0000"] = {
    ...EXAMPLE["/predictions"].data[0],
    messages: [{ role: "user", content: [{ type: "text", text: "You will analyze user behavior and predict what the user will do next. Below are the actions the user took.\n\n<actions>\n    <action>Types a letter in the editor.</action>\n</actions>\n\nPredict the next 2 actions the user will take." }] }],
    retrieved: "",
    accuracy_prompt: "You are an expert evaluator. …", accuracy_reply: "{\"candidates\": [{\"id\": 1, \"score\": 0.55}]}",
    formatting_prompt: "You are an expert evaluator. …", formatting_reply: "{\"score\": 0.78}" };
  useExamples(EXAMPLE);

  const detail = document.getElementById("detail");
  const chats = document.getElementById("chats");
  const keyed = (node, key) => { node.dataset.key = key; return node; };

  // Chats

  // A chat's title is the first line of its first user message (the server's chat_title).
  const titleOf = (messages) => messages.find((m) => m.role === "user")?.content.split("\n")[0] ?? "New chat";
  const message = (m) => [el("span", { className: "who", textContent: m.role === "user" ? "You" : m.role === "assistant" ? "Juno" : m.role }),
    m.role === "assistant" ? markdown(m.content) : el("p", { textContent: m.content })];

  // A chat: its messages, then a box to send the next one.
  let openChat = null;
  function chatView(chatId, messages) {
    openChat = chatId;
    const transcript = el("div", { className: "transcript" }, ...messages.flatMap(message));
    const scroller = el("div", { className: "scroll" }, el("h1", { textContent: titleOf(messages) }), transcript);
    const input = el("input", { id: "composer", placeholder: "Message", autocomplete: "off", ariaLabel: "Message" });
    const button = el("button", { textContent: "Send" });
    const form = el("form", {}, input, button);
    form.onsubmit = async (event) => {
      event.preventDefault();
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      input.disabled = button.disabled = true;
      const sent = message({ role: "user", content });
      const waiting = [el("span", { className: "who", textContent: "Juno" }), el("p", { className: "dim", textContent: "…" })];
      transcript.append(...sent, ...waiting);
      scroller.scrollTop = scroller.scrollHeight;
      try {
        const chat = await send(chatId, content);
        if (openChat !== chatId) return;
        detail.replaceChildren(...chatView(chatId, chat.messages));
        listChats();  // a new chat appears; an existing one moves to the top
      } catch (error) {
        // The server keeps nothing on failure, so the message goes back in the box.
        sent.forEach((node) => node.remove());
        waiting[1].textContent = messageOf(error);
        input.value = content;
        input.disabled = button.disabled = false;
        input.focus();
      }
    };
    requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; input.focus(); });
    return [scroller, form];
  }

  const chatRow = (chat) => {
    const button = keyed(el("button", { className: "row" },
      el("b", { textContent: chat.title || "New chat" }),
      el("small", { textContent: `${chat.message_count} messages · ${time(chat.updated_at)}` })), chat.id);
    button.onclick = () => {
      select(button);
      load(detail, async () => {
        const full = await api(`/chats/${chat.id}`);
        return chatView(full.id, full.messages);
      }, () => button.getAttribute("aria-current") === "true");
    };
    return el("li", {}, button);
  };
  const reselectChat = () => select(chats.querySelector(`[data-key="${CSS.escape(openChat ?? "")}"]`));
  const listChats = () => load(chats, async () => [await paged("/chats", chatRow)]).then(reselectChat);
  // A new chat exists only on the client until its first message is sent.
  document.getElementById("new-chat").onclick = () => {
    select(null);
    detail.replaceChildren(...chatView(crypto.randomUUID(), []));
  };

  // On startup: the chats, with the most recent one open; one pending state for both.
  load(detail, async () => {
    const first = await api("/chats?limit=20");
    const latest = first.data[0];
    const full = latest ? await api(`/chats/${latest.id}`) : null;
    chats.replaceChildren(await paged("/chats", chatRow, first));
    if (!full) return chatView(crypto.randomUUID(), []);
    const view = chatView(full.id, full.messages);
    reselectChat();
    return view;
  });

  // The deck: devices and settings, from GET /control polled every poll_seconds.

  // This computer's recorder is a process of the desktop app; null outside it.
  const recorderStatus = () => (window.juno?.captureStatus ? window.juno.captureStatus() : Promise.resolve(null));
  let control = null;
  let controlError = null;
  let recorder = null;
  let polled = false;

  const panel = document.getElementById("panel");
  const light = document.getElementById("devices-light");
  let open = null;  // the panel shown: "devices", "settings" or null

  const head = (title) => el("header", {}, el("b", { textContent: title }),
    el("button", { className: "close", ariaLabel: `Close ${title.toLowerCase()}`, onclick: () => showPanel(null) }, icon("down")));
  const capitalized = (text) => text.charAt(0).toUpperCase() + text.slice(1);
  const unreachable = () => (polled ? `The server cannot be reached · ${messageOf(controlError)}` : "Reaching the server…");

  // One switch of /control: a light, what it is and what it last reported, the switch.
  function switchItem(state, name, note, on, word, set) {
    const line = el("small", { textContent: capitalized(note) });
    const onChanged = (next) => { control = next; drawDeck(); };
    return el("li", {}, el("span", { className: `light ${state}` }), el("div", {}, el("b", { textContent: name }), line),
      el("label", { className: "toggle" }, switchBox(on, line, set, onChanged, { className: "sw" }), word));
  }
  const recorderLines = () => (recorder === null ? []
    : recorder.running ? [el("p", { className: "note", textContent: "This computer's recorder is running." })]
    : [el("p", { className: "note", textContent: `This computer's recorder exited (${recorder.exitCode}). Fix the cause and restart the app.` }),
       el("pre", { textContent: recorder.log.join("\n") })]);
  function devicesPanel() {
    if (!control) return [head("Devices"), ...recorderLines(), el("p", { className: "note", textContent: unreachable() })];
    const { server, devices } = control;
    const ids = Object.keys(devices);
    return [head("Devices"), ...recorderLines(), el("ul", {},
      switchItem(server.annotate ? "recording" : "idle", "Annotation", queueNote(server), server.annotate, "Annotate",
                 (on) => patch("/control/server", { annotate: on })),
      ...ids.map((id) => switchItem(deviceState(devices[id]), id, deviceNote(devices[id]), devices[id].capture, "Record",
                                    (on) => patch(`/control/devices/${id}`, { capture: on })))),
      ...(ids.length ? [] : [el("p", { className: "note", textContent: "No device has reported yet." })])];
  }

  const connection = () => {
    const n = control ? Object.keys(control.devices).length : 0;
    return [el("span", { className: `light ${control ? "recording" : "offline"}` }),
            control ? `Connected · ${n} device${n === 1 ? " has" : "s have"} reported` : unreachable()];
  };
  // The address is kept by the desktop app (window.juno.setServerUrl); a page the
  // server serves can only show the one it was opened at.
  function settingsPanel() {
    const input = el("input", { id: "server", type: "url", value: BASE || location.origin, spellcheck: false, required: true });
    const save = el("button", { textContent: "Save", hidden: !window.juno?.setServerUrl });
    input.readOnly = save.hidden;
    const note = el("p", { className: "note", id: "connection" }, ...connection());
    const form = el("form", {}, input, save);
    form.onsubmit = async (event) => {
      event.preventDefault();
      save.disabled = true;
      let saved;
      try {
        saved = await window.juno.setServerUrl(input.value.trim());
      } catch (error) {
        saved = { error: messageOf(error) };
      }
      if (saved.error) {
        note.replaceChildren(el("span", { className: "light changing" }), saved.error);
        save.disabled = false;
        return;
      }
      location.reload();  // every view is read again from the new address
    };
    return [head("Settings"), el("label", { className: "field", htmlFor: "server", textContent: "Server address" }), form, note];
  }

  function showPanel(name) {
    open = name;
    panel.hidden = !open;
    for (const tab of document.querySelectorAll("[data-panel]")) tab.setAttribute("aria-expanded", String(tab.dataset.panel === open));
    panel.replaceChildren(...(open === "devices" ? devicesPanel() : open === "settings" ? settingsPanel() : []));
  }
  // Redraws what shows /control without a loading state: the light always, the
  // devices panel unless a switch is waiting for the server, the settings
  // panel's connection line only, so a half-typed address stays.
  function drawDeck() {
    const state = overallState(control, recorder);
    light.className = `light ${state}`;
    document.querySelector('[data-panel="devices"]').ariaLabel = `Devices: ${state}`;
    if (open === "devices" && !panel.querySelector("input:disabled")) panel.replaceChildren(...devicesPanel());
    if (open === "settings") document.getElementById("connection")?.replaceChildren(...connection());
  }
  async function poll() {
    const [next, local] = await Promise.allSettled([api("/control"), recorderStatus()]);
    control = next.status === "fulfilled" ? next.value : null;
    controlError = next.status === "rejected" ? next.reason : null;
    recorder = local.status === "fulfilled" ? local.value : null;
    polled = true;
    drawDeck();
    setTimeout(poll, (control?.poll_seconds ?? 5) * 1000);
  }
  poll();

  // The view buttons: each shows its pane, read anew; pressing the shown one goes back to the chats.
  const panes = { chats: document.getElementById("chats-pane"), timeline: document.getElementById("timeline-pane"),
                  predictions: document.getElementById("predictions-pane") };
  let view = "chats";
  function showView(next) {
    view = next === view ? "chats" : next;
    for (const tab of document.querySelectorAll("[data-view]")) tab.setAttribute("aria-pressed", String(tab.dataset.view === view));
    for (const [name, pane] of Object.entries(panes)) pane.hidden = name !== view;
    if (view === "timeline") timelinePane(panes.timeline, detail, () => control);
    if (view === "predictions") predictionsPane(panes.predictions, detail);
  }
  for (const tab of document.querySelectorAll("[data-view]")) tab.onclick = () => showView(tab.dataset.view);
  for (const tab of document.querySelectorAll("[data-panel]")) tab.onclick = () => showPanel(open === tab.dataset.panel ? null : tab.dataset.panel);

  // The divider between the panes: dragged, it sets the left pane's width, remembered on this computer.
  const ASIDE_KEY = "juno.aside";
  const ASIDE = { min: 280, max: 640 };
  const app = document.getElementById("app");
  const splitter = document.getElementById("splitter");
  const setAside = (width) => app.style.setProperty("--aside", `${Math.min(ASIDE.max, Math.max(ASIDE.min, width))}px`);
  try {
    const saved = Number(localStorage.getItem(ASIDE_KEY));
    if (saved) setAside(saved);
  } catch {
    // The default width; the drag still works.
  }
  splitter.onpointerdown = (event) => {
    splitter.setPointerCapture(event.pointerId);
    splitter.classList.add("dragging");
    splitter.onpointermove = (move) => setAside(move.clientX - app.getBoundingClientRect().left);
    splitter.onpointerup = () => {
      splitter.onpointermove = splitter.onpointerup = null;
      splitter.classList.remove("dragging");
      try {
        localStorage.setItem(ASIDE_KEY, parseInt(app.style.getPropertyValue("--aside"), 10));
      } catch {
        // Not remembered; the default width shows next time.
      }
    };
  };
</script>
