# Settings for `python -m juno` and the two processes it starts.
# Read from the working directory, or from the path in JUNO_CONFIG_PATH.

# Seconds a process gets to exit after SIGTERM before it is killed.
stop_timeout_seconds: 30

server:
  host: 100.123.107.55
  port: 8765

llm:
  # The OpenAI-compatible server that chats are completed by. The model is
  # whichever one that server lists.
  base_url: http://localhost:8000
  max_tokens: 2048
  temperature: 0.7
  # Seconds to wait for a reply.
  timeout_seconds: 300

tools:
  # Tools the chat model has besides reading annotations. Anyone who can reach
  # this server can have them used, through /chats or /mcp.
  bash:
    enabled: true
    # Run commands under bubblewrap: system directories read-only, no home
    # directory, only <data_dir>/workspace writable; the network stays open.
    # false: commands run as this user, with all of its files.
    sandbox: true
    # Seconds a command may run before it is killed.
    timeout_seconds: 60
  web_search:
    enabled: true
    # Most results one search returns.
    max_results: 8
  claude:
    # fwd_to_claude: prompts forwarded to Claude Code in a tmux window of the
    # running tmux server (a session named juno is started if there is none).
    # Claude runs as this user, outside the bash sandbox.
    enabled: true
    # Model of a new conversation when the call names none. null: Claude Code's default.
    model: null
    # --permission-mode for new conversations. null: Claude Code's own setting.
    permission_mode: null
    # Seconds to wait for Claude to finish one turn.
    timeout_seconds: 600

capture:
  # Base directory; the recorder's sessions go under screen/sessions/, the
  # server's copies of every device's under screen/devices/, chats under chats/.
  # null: $XDG_DATA_HOME/juno, or ~/.local/share/juno.
  data_dir: null
  # The name this computer's sessions are stored under on the server: lowercase
  # letters and digits. null: the host name, reduced to those.
  device_id: linux
  # Platform sources: auto (detect from the platform and session), wayland, x11,
  # macos, fake.
  backend: auto
  fps: 5
  # Seconds of frames to keep in memory.
  buffer_seconds: 120
  # Target DPI for saved screenshots.
  dpi: 100
  # Scale factor for screenshots (0.0-1.0); overrides dpi.
  scale: null
  # Maximal screenshot resolution as [width, height].
  max_res: null
  # Event types to skip: move, scroll, click, key.
  disable: [move]
  # Whether screenshot files are written.
  screenshots: true
  # Stop after this many seconds. null: run until Ctrl+C.
  duration: null
  verbose: false

annotate:
  # The litellm model that annotates recorded sessions (`python -m annotate`).
  # A gemini/ model reads its key from GEMINI_API_KEY, in the environment or .env.
  model: gemini/gemini-3.1-flash-lite
  # Upper bound on the reply, hidden reasoning included.
  max_tokens: 8192
  # Aggregations (screenshots) per request.
  chunk_size: 10
  # Whether the recorder uploads each aggregation to the server, which annotates
  # each chunk as it fills. Every screenshot then goes to the model's provider.
  live: true
  # Model calls the server keeps in flight at once.
  max_concurrency: 4
  # Calls made for one chunk before its annotation is left failed. A call is
  # repeated only when the provider was busy or the reply was not an annotation.
  max_attempts: 3
  # Seconds one call may take.
  timeout_seconds: 300
  # Seconds every call waits after the provider was busy: the base doubles with
  # each attempt of the chunk, up to the maximum.
  retry_base_seconds: 5
  retry_max_seconds: 120
  # Whether the server, on its own, annotates every chunk in its store that has
  # no finished annotation, most recent first, behind the chunks recorders are
  # filling now. Every stored screenshot then goes to the model's provider.
  backfill: true
  # Seconds between the server's looks through its store for such chunks.
  scan_interval_seconds: 60
  # Seconds a session must have gone without a new row before the rows after its
  # last full chunk are annotated.
  tail_idle_seconds: 300

predict:
  # Next-action prediction (`POST /predictions`); the defaults are Tada's.
  # Annotated actions the model is shown; a prediction needs at least this many.
  past_len: 50
  # Actions the model is asked to predict.
  future_len: 8
  # Screenshots sent, those of the newest actions. null: text only. The model
  # server must accept images (vLLM without --language-model-only).
  num_imgs_per_sample: 5
  max_tokens: 2048
  temperature: 1.0
  # Earlier activity retrieved with BM25, and how many of those are kept after
  # MMR removes near-duplicates (alpha 1.0: relevance only).
  top_k: 20
  mmr_k: 10
  mmr_alpha: 0.5
  # How fast older activity loses retrieval score, per day of age.
  time_decay_lambda: 0.5
