[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juno-capture"
version = "0.1.0"
description = "Juno activity monitoring: a napsack-compatible event writer with pluggable platform sources."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned: capture reuses napsack's queue/aggregation/save internals,
    # so the on-disk format and burst logic are exactly Tada's.
    "napsack==0.1.3",
    "numpy",
    "pillow",
    # The annotation call (`annotate.label`) and its API key in .env.
    "litellm",
    "python-dotenv",
    # The API server (`python -m server`).
    "fastapi",
    "uvicorn",
    # Calls to vLLM from the chat route (`server.llm`).
    "httpx",
    # The YAML config (`juno.config`).
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
# Needed only by the Wayland backend and its spikes.
wayland = ["evdev>=1.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/annotate", "src/capture", "src/juno", "src/server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# napsack's unpinned dependency tree lets the resolver fall back to releases
# with no wheels for this Python. Hold these at what Tada's lockfile resolves to.
constraint-dependencies = ["tokenizers>=0.20"]
