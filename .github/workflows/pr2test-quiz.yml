name: pr2test quiz

# On every non-draft PR: Claude writes .pr2test/quiz.json, a deterministic
# step validates it, seals the answer key, and posts the quiz as a PR comment.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr2test-quiz-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quiz:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Write quiz with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            PR_NUMBER: ${{ github.event.pull_request.number }}
            REPO: ${{ github.repository }}

            Follow the instructions in pr2test/PROMPT.md exactly.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate, seal, and post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR2TEST_SECRET: ${{ secrets.PR2TEST_SECRET }}
        run: |
          if [ ! -f .pr2test/quiz.json ]; then
            echo "::warning::No .pr2test/quiz.json; the agent step was skipped or wrote nothing. Nothing posted."
            exit 0
          fi
          pip install -q "pydantic>=2,<3" "cryptography>=42"
          python -m pr2test.post_quiz --pr "${{ github.event.pull_request.number }}"
