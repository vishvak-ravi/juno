[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juno-core"
version = "0.1.0"
description = "What the Juno server and recorder share: settings, session ids and rows, event ids, the recorder's report."
requires-python = ">=3.12,<3.14"
dependencies = [
    # The settings models (`juno.config`) and the shared row and report models.
    "pydantic",
    # The YAML config (`juno.config`).
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/juno"]
