[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juno-capture"
version = "0.1.0"
description = "The Juno recorder: a napsack-compatible event writer with pluggable platform sources."
requires-python = ">=3.12,<3.14"
dependencies = [
    "juno-core",
    # Pinned: capture reuses napsack's queue/aggregation/save internals,
    # so the on-disk format and burst logic are exactly Tada's.
    "napsack==0.1.3",
    # The macOS and X11 sources (`capture.sources.pynput_mss`), napsack's own
    # libraries; mss.MSS is new in 10.2.
    "mss>=10.2,<11",
    "pynput>=1.8.1",
    "screeninfo>=0.8.1",
    # The Wayland input source (`capture.sources.wayland.evdev_input`).
    "evdev>=1.7; sys_platform == 'linux'",
    "numpy",
    "pillow",
    # Uploads and the control report (`capture.upload`, `capture.__main__`).
    "httpx",
    # The report's answer (`capture.__main__`).
    "pydantic",
    # The device's .env (`capture.__main__`).
    "python-dotenv",
]

[tool.uv.sources]
juno-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/capture"]
