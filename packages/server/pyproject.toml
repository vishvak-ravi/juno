[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juno-server"
version = "0.1.0"
description = "The Juno API server: events, annotation, prediction, chat and MCP."
requires-python = ">=3.12,<3.14"
dependencies = [
    "juno-core",
    # The /draw page is recorded by the recorder, run inside the server (`server.draw`).
    "juno-capture",
    # The annotation request and sanitizing follow napsack's (`annotate`).
    "napsack==0.1.3",
    "numpy",
    "pillow",
    # The annotation call (`annotate.label`) and its API key in .env.
    "litellm",
    "python-dotenv",
    # The API server (`python -m server`).
    "fastapi",
    "uvicorn",
    "python-multipart>=0.0.32",
    # Calls to vLLM from the chat route (`server.agent.llm`).
    "httpx",
    "mcp>=2.3.0",
    # The /draw page's socket (`server.routes.draw`), served by uvicorn.
    "websockets",
    # The web_search tool (`server.agent.search`).
    "ddgs>=9",
]

[tool.uv.sources]
juno-core = { workspace = true }
juno-capture = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/annotate", "src/grade", "src/predict", "src/server"]
